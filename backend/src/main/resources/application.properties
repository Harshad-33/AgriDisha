# Server Configuration
server.port=8080
server.servlet.context-path=/

# Application Branding
spring.application.name=agridisha-backend

# MySQL Database Configuration (with environment variable overrides)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/agridisha_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# File Upload Settings
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Spring Mail Configuration (Gmail SMTP)
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=*
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2 TLSv1.3
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Cloud HTTPS Email Delivery (Brevo REST API - Port 443 HTTPS for cloud hosts blocking SMTP)
agridisha.mail.brevo-api-key=${BREVO_API_KEY:}

# OpenWeatherMap API Integration
agridisha.weather.api-key=${OPENWEATHER_API_KEY:}
agridisha.weather.api-url=https://api.openweathermap.org/data/2.5/weather

# Python ML Microservice URL
agridisha.ml.service-url=${ML_SERVICE_URL:http://localhost:8000}

# JWT Security Configuration (HS256 256-bit secure secret key)
agridisha.jwt.secret=9a4f2c8d3e5b7a1f6c8e0d2b4a6c8e1f3a5b7c9d0e2f4a6b8c0d2e4f6a8b0c2d
agridisha.jwt.expiration-ms=86400000

# CORS Allowed Origins
agridisha.cors.allowed-origins=http://localhost:4200,http://localhost:80,http://127.0.0.1:4200
