<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="card card-harvest border-0 p-4 p-md-5">
        <div class="text-center mb-4">
          <div class="d-inline-flex p-3 bg-success-subtle text-success rounded-circle mb-3 fs-3">
            <i class="bi bi-person-lock"></i>
          </div>
          <h2 class="fw-bold">Welcome Back</h2>
          <p class="text-muted small">Log in to view your predictions, farm history, and insights.</p>
        </div>

        <div *ngIf="errorMessage" class="alert alert-danger d-flex align-items-center gap-2 py-2 small" role="alert">
          <i class="bi bi-exclamation-triangle-fill"></i>
          <div>{{ errorMessage }}</div>
        </div>

        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" novalidate>
          <div class="mb-3">
            <label class="form-label" for="username">Username or Email</label>
            <div class="input-group">
              <span class="input-group-text bg-light"><i class="bi bi-person"></i></span>
              <input
                id="username"
                type="text"
                class="form-control"
                placeholder="e.g. farmer_john"
                formControlName="username"
                [class.is-invalid]="loginForm.get('username')?.touched && loginForm.get('username')?.invalid">
            </div>
            <div *ngIf="loginForm.get('username')?.touched && loginForm.get('username')?.invalid" class="text-danger small mt-1">
              Username or email is required.
            </div>
          </div>

          <div class="mb-4">
            <label class="form-label" for="password">Password</label>
            <div class="input-group">
              <span class="input-group-text bg-light"><i class="bi bi-key"></i></span>
              <input
                id="password"
                type="password"
                class="form-control"
                placeholder="••••••••"
                formControlName="password"
                [class.is-invalid]="loginForm.get('password')?.touched && loginForm.get('password')?.invalid">
            </div>
            <div *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.invalid" class="text-danger small mt-1">
              Password must be at least 4 characters.
            </div>
          </div>

          <button type="submit" [disabled]="isLoading" class="btn btn-harvest-primary w-100 py-2 fw-semibold d-flex align-items-center justify-content-center gap-2">
            <span *ngIf="isLoading" class="spinner-border spinner-border-sm" role="status"></span>
            <span>{{ isLoading ? 'Logging in...' : 'Sign In' }}</span>
          </button>
        </form>

        <div class="text-center mt-4 pt-3 border-top small text-muted">
          Don't have an account yet?
          <a routerLink="/register" class="text-success fw-bold text-decoration-none ms-1">Create Account</a>
        </div>
      </div>
    </div>
  </div>
</div>
