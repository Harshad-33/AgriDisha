<nav class="navbar navbar-expand-lg navbar-dark bg-dark-harvest sticky-top shadow-sm">
  <div class="container">
    <a class="navbar-brand d-flex align-items-center gap-2" routerLink="/home">
      <i class="bi bi-flower1 fs-3 text-emerald"></i>
      <span class="fw-bold tracking-tight text-white fs-4">AgriDisha</span>
    </a>

    <button
      class="navbar-toggler border-0"
      type="button"
      (click)="toggleMenu()"
      aria-controls="agridishaNav"
      aria-expanded="false"
      aria-label="Toggle navigation">
      <i class="bi bi-list fs-2 text-white"></i>
    </button>

    <div class="collapse navbar-collapse" [class.show]="!isMenuCollapsed" id="agridishaNav">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-4 gap-lg-1">
        <li class="nav-item">
          <a class="nav-link" routerLink="/home" routerLinkActive="active" (click)="isMenuCollapsed = true">
            <i class="bi bi-house-door me-1"></i> Home
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/crop-recommendation" routerLinkActive="active" (click)="isMenuCollapsed = true">
            <i class="bi bi-tree me-1"></i> Crop Recommendation
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/fertilizer-recommendation" routerLinkActive="active" (click)="isMenuCollapsed = true">
            <i class="bi bi-droplet-half me-1"></i> Fertilizer
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/disease-detection" routerLinkActive="active" (click)="isMenuCollapsed = true">
            <i class="bi bi-virus me-1"></i> Disease Detection
          </a>
        </li>
        <li class="nav-item" *ngIf="authService.currentUser$ | async">
          <a class="nav-link" routerLink="/history" routerLinkActive="active" (click)="isMenuCollapsed = true">
            <i class="bi bi-clock-history me-1"></i> History
          </a>
        </li>
      </ul>

      <!-- Right Action Items: Language Selector + Profile/Auth -->
      <div class="d-flex flex-column flex-lg-row align-items-lg-center gap-2 mt-3 mt-lg-0">
        
        <!-- 🌐 22 Official Indian Languages Selector Dropdown -->
        <div class="position-relative lang-selector-container">
          <button
            type="button"
            class="btn btn-outline-light btn-sm d-flex align-items-center gap-2 px-3 py-1 rounded-pill lang-btn"
            (click)="toggleLangDropdown($event)"
            title="Choose Language (22 Indian Languages Supported)">
            <i class="bi bi-translate text-emerald fs-6"></i>
            <span class="fw-semibold">{{ translationService.currentLanguage.nativeName }}</span>
            <i class="bi bi-chevron-down small transition-transform" [class.rotate-180]="isLangDropdownOpen"></i>
          </button>

          <!-- Dropdown Menu -->
          <div *ngIf="isLangDropdownOpen" class="lang-dropdown-menu shadow-lg rounded-3 p-2 border border-secondary" (click)="$event.stopPropagation()">
            <div class="p-2 border-bottom border-secondary mb-2">
              <div class="d-flex align-items-center justify-content-between mb-2">
                <span class="small text-emerald fw-bold text-uppercase tracking-wider">
                  <i class="bi bi-globe me-1"></i> Official Indian Languages
                </span>
                <span class="badge bg-emerald text-white rounded-pill px-2 py-1" style="font-size: 0.65rem;">22 Official</span>
              </div>
              <div class="input-group input-group-sm">
                <span class="input-group-text bg-dark border-secondary text-muted">
                  <i class="bi bi-search"></i>
                </span>
                <input
                  type="text"
                  class="form-control bg-dark text-white border-secondary small"
                  placeholder="Search language..."
                  [(ngModel)]="searchQuery"
                  (click)="$event.stopPropagation()"
                  autofocus>
              </div>
            </div>

            <!-- Scrollable Language List -->
            <div class="lang-list-scroll">
              <button
                *ngFor="let lang of filteredLanguages"
                type="button"
                (click)="selectLanguage(lang.code)"
                class="lang-item-btn d-flex align-items-center justify-content-between w-100 text-start px-3 py-2 rounded text-white border-0 bg-transparent"
                [class.lang-item-active]="lang.code === translationService.currentLanguage.code">
                <div class="d-flex flex-column">
                  <span class="fw-bold small">{{ lang.nativeName }}</span>
                  <span class="text-muted extra-small" style="font-size: 0.72rem;">{{ lang.name }}</span>
                </div>
                <div class="d-flex align-items-center gap-1">
                  <span *ngIf="lang.isPopular && lang.code === 'mr'" class="badge bg-success text-white rounded-pill px-2 py-0" style="font-size: 0.65rem;">
                    Maharashtra
                  </span>
                  <i *ngIf="lang.code === translationService.currentLanguage.code" class="bi bi-check2 text-emerald fw-bold fs-6"></i>
                </div>
              </button>

              <div *ngIf="filteredLanguages.length === 0" class="p-3 text-center text-muted small">
                No languages match "{{ searchQuery }}"
              </div>
            </div>
          </div>
        </div>

        <!-- Authenticated Profile Section -->
        <div class="d-flex align-items-center gap-2" *ngIf="authService.currentUser$ | async as user; else guestNav">
          <a routerLink="/dashboard" class="btn btn-outline-light btn-sm d-flex align-items-center gap-1 px-3 py-1 rounded-pill" (click)="isMenuCollapsed = true">
            <i class="bi bi-speedometer2"></i> Dashboard
          </a>
          <a routerLink="/profile" class="btn btn-outline-light btn-sm d-flex align-items-center gap-1 px-3 py-1 rounded-pill" (click)="isMenuCollapsed = true">
            <i class="bi bi-person-circle"></i> {{ user.username }}
          </a>
          <button (click)="logout(); isMenuCollapsed = true" class="btn btn-danger btn-sm px-3 py-1 rounded-pill">
            <i class="bi bi-box-arrow-right me-1"></i> Logout
          </button>
        </div>

        <!-- Guest Login / Register Section -->
        <ng-template #guestNav>
          <div class="d-flex align-items-center gap-2">
            <a routerLink="/login" class="btn btn-outline-light btn-sm px-3 py-1 rounded-pill" (click)="isMenuCollapsed = true">
              <i class="bi bi-box-arrow-in-right me-1"></i> Login
            </a>
            <a routerLink="/register" class="btn btn-emerald btn-sm px-3 py-1 rounded-pill text-white fw-semibold" (click)="isMenuCollapsed = true">
              <i class="bi bi-person-plus me-1"></i> Register
            </a>
          </div>
        </ng-template>

      </div>
    </div>
  </div>
</nav>
